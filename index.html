<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0649b8">
  <title>عقارات للإيجار | موريتانيا</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root{--blue:#0649b8;--blue2:#0875ee;--gold:#f2ad08;--ink:#13254a;--muted:#64748b;--bg:#f3f6fc}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
    header{background:linear-gradient(135deg,#063a98,#0875ee);color:white;padding:20px 16px 18px;border-radius:0 0 24px 24px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:23px;font-weight:800}.mark{font-size:29px}
    .sub{margin:8px 0 16px;color:#e5efff;font-size:13px}
    input,select,button{font:inherit} .search{width:100%;border:0;border-radius:15px;padding:14px 16px;background:#fff;color:#172554;outline:none}
    main{max-width:760px;margin:auto;padding:16px}
    .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:4px 0 22px}
    .cat{border:1px solid #dbe7fb;background:white;border-radius:16px;padding:14px 5px;text-align:center;font-weight:bold;color:var(--blue);box-shadow:0 3px 10px #183c7710}
    .cat span{display:block;font-size:25px;margin-bottom:5px}
    .section{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 12px}.section h2{font-size:18px;margin:0}
    .count{font-size:12px;color:var(--muted)}
    .filters{display:flex;gap:8px;margin-bottom:14px;overflow:auto}.filters button{white-space:nowrap;border:1px solid #d6e2f5;background:#fff;color:var(--blue);border-radius:20px;padding:8px 14px}.filters button.active{background:var(--blue);color:white}
    .cards{display:grid;gap:12px}.card{display:grid;grid-template-columns:116px 1fr;background:white;border-radius:17px;overflow:hidden;box-shadow:0 4px 14px #183c7712;border:1px solid #e3eaf5;min-height:130px}
    .photo{display:grid;place-items:center;background:linear-gradient(145deg,#b9d9ff,#eaf3ff);font-size:48px}
    .details{padding:12px}.details h3{margin:0 0 7px;font-size:16px}.loc{color:var(--muted);font-size:12px;margin-bottom:9px}.meta{font-size:12px;color:#475569;margin-bottom:10px}
    .price{color:var(--blue);font-weight:800}.unit{font-size:11px;color:var(--muted);font-weight:normal}
    .empty{display:none;text-align:center;padding:30px;color:var(--muted)}
    nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #e4eaf4;display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));max-width:760px;margin:auto}
    nav button{border:0;background:none;color:#64748b;font-size:12px}nav b{display:block;font-size:20px;margin-bottom:3px;color:var(--blue)}
    .note{font-size:11px;color:#64748b;text-align:center;margin:18px 0}
    @media(min-width:600px){.cards{grid-template-columns:1fr 1fr}.card{grid-template-columns:105px 1fr}}
  </style>
</head>
<body>
<header>
  <div class="top"><div class="brand">عقارات للإيجار</div><div class="mark">⌂ 🔑</div></div>
  <div class="sub">ابحث عن منزلك القادم في موريتانيا</div>
  <input id="search" class="search" placeholder="ابحث عن عقار أو مدينة..." aria-label="البحث عن عقار">
</header>
<main>
  <div class="cats">
    <button class="cat" data-type="محلات تجارية"><span>🏬</span>محلات تجارية</button>
    <button class="cat" data-type="شقق"><span>🏢</span>شقق</button>
    <button class="cat" data-type="منازل"><span>🏠</span>منازل</button>
  </div>
  <div class="section"><h2>أحدث العقارات</h2><span class="count" id="count">إعلانات تجريبية</span></div>
  <div class="filters">
    <button class="active" data-filter="الكل">الكل</button>
    <button data-filter="منازل">منازل</button>
    <button data-filter="شقق">شقق</button>
    <button data-filter="محلات تجارية">محلات تجارية</button>
  </div>
  <div id="cards" class="cards"></div>
  <div id="empty" class="empty">لا توجد نتائج مطابقة. جرّب كلمة أخرى.</div>
  <p class="note">هذه نسخة تجريبية ببيانات توضيحية، وليست إعلانات حقيقية.</p>
</main>
<nav>
  <button><b>⌂</b>الرئيسية</button><button><b>♡</b>المفضلة</button><button><b>▤</b>الرسائل</button><button><b>♙</b>حسابي</button>
</nav>
<script>
const properties = [
 {type:"منازل",name:"منزل جميل للإيجار",city:"نواكشوط",area:"تفرغ زينة",rooms:4,baths:3,price:"300,000",icon:"🏡"},
 {type:"شقق",name:"شقة مريحة للإيجار",city:"نواكشوط",area:"تفرغ زينة",rooms:2,baths:1,price:"150,000",icon:"🏢"},
 {type:"محلات تجارية",name:"محل تجاري على شارع رئيسي",city:"نواكشوط",area:"لكصر",rooms:1,baths:1,price:"120,000",icon:"🏬"},
 {type:"منازل",name:"منزل عائلي واسع",city:"نواكشوط",area:"عرفات",rooms:3,baths:2,price:"220,000",icon:"🏠"}
];
let filter="الكل";
const cards=document.getElementById("cards"), search=document.getElementById("search");
function render(){
 const q=search.value.trim().toLowerCase();
 const list=properties.filter(p=>(filter==="الكل"||p.type===filter)&&[p.name,p.city,p.area,p.type].join(" ").toLowerCase().includes(q));
 cards.innerHTML=list.map(p=>`<article class="card"><div class="photo">${p.icon}</div><div class="details"><h3>${p.name}</h3><div class="loc">📍 ${p.area}، ${p.city}</div><div class="meta">🛏 ${p.rooms} غرف　 🚿 ${p.baths} حمامات</div><div class="price">${p.price} أوقية <span class="unit">/ شهرياً</span></div></div></article>`).join("");
 document.getElementById("empty").style.display=list.length?"none":"block";
 document.getElementById("count").textContent=list.length+" إعلانات تجريبية";
}
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()}));
document.querySelectorAll("[data-type]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.type;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x.dataset.filter===filter));render()}));
search.addEventListener("input",render);render();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
